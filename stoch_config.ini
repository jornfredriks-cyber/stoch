[screener]
# Pre-filter thresholds applied before the stochastic scan (same intent as
# Darvas Phase3 Scan's screener: cut the ~6,500-ticker universe down to a
# liquid, trending, small set worth downloading OHLC for individually).
min_price           = 10.0
min_market_cap      = 500000000
min_avg_vol_30d     = 500000
min_adr_pct         = 2.0
ema_fast            = 50
ema_slow            = 200
rsi_low             = 0
rsi_high            = 100
ath_max_dist_pct    = 10.0
history_period      = 1y
fetch_chunk_size    = 50
inter_chunk_delay   = 1.0

[stoch_scanner]
# Weekly Stochastic Oscillator settings. Length 19, %K smoothing 4, %D
# smoothing 4 -- "Weekly Stochastic Sweet Spot Strategy.md"'s original
# settings. Briefly swapped to the backtest_signal_sweep.py-optimized combo
# (3/7/7, 2026-07-21: $826,560.63 total P&L, 75.93% win rate, 2,061 closed
# trades) on 2026-07-23; reverted back to 19/4/4 on 2026-07-30 -- this is
# the current, intentional setting.
# Sweet spot band is 32-80 (%K inside the band, above %D, and rising vs.
# k_rising_lookback weeks back approximates catching the up-cross into/
# through the zone).
stoch_length        = 19    
stoch_k_smooth      = 4
stoch_d_smooth      = 4     
stoch_k_min         = 32.0
stoch_k_max         = 80.0
k_rising_lookback   = 1
fetch_chunk_size    = 50

[backtest_signal]
# backtest_signal.py: fixed-dollar-notional backtest of the "Stochastic
# Weekly Signal" Pine indicator's exact entry/exit crossover events
# (distinct rule set from [stoch_scanner]'s state-based backtest.py).
trade_value_usd     = 1000.0

[stoch_signal_scan]
# stoch_signal_scan.py: is_not_stretched() -- an additional "not chasing an
# extended move" gate on top of the fresh crossover check, requiring the
# current daily close to sit within ema_band_min_pct-ema_band_max_pct%
# above its daily EMA(ema_length). Retired ema50_screener.py's standalone
# full-market pre-filter (2026-07-26) folded into this single check --
# price/volume/ADR/market-cap/trend/RSI/ATH-proximity quality is already
# handled upstream by the Darvas Raw screener that supplies this universe,
# so only the genuinely new idea (EMA-proximity) needed to move over.
ema_length          = 50
ema_band_min_pct    = 0.0
ema_band_max_pct    = 5.0

[stoch_fresh_scan]
# stoch_fresh_scan.py: flags Stoch's own screener universe for a fresh
# weekly Stochastic buy crossover (%K crosses strictly above entry_level,
# %K>%D) within the last lookback_weeks FULLY COMPLETED weekly bars -- the
# current, still-forming week is always excluded. entry_level is kept
# independent of [stoch_scanner]'s stoch_k_min (same value today, but a
# distinct concept: an entry-crossover threshold vs. a persistent-band
# floor). No EMA/not-stretched gate here -- unlike stoch_signal_scan.py,
# this scan only requires the fresh crossover itself.
lookback_weeks      = 2
entry_level         = 32.0

[stoch_basic_screener]
# stoch_basic_screener.py: a deliberately loose full-market pre-filter for
# stoch_basic_scan.py -- unlike [screener] above, this has NO ema_fast/
# ema_slow uptrend requirement and NO ath_max_dist_pct proximity-to-high
# requirement, since the whole point of the Basic Scanner is to surface
# names that have DECLINED, which those two filters would otherwise
# actively exclude. min_adr_pct is kept (a liquidity/tradability check,
# orthogonal to trend direction). Loose by design, per user request
# (2026-08-27) -- start minimal, tighten later once real output is seen.
min_price           = 10.0
min_market_cap      = 300000000
min_avg_vol_30d     = 1000000
min_adr_pct         = 2.0
fetch_chunk_size    = 50

[stoch_basic_scan]
# stoch_basic_scan.py: flags Stoch Basic Screener candidates whose latest
# Weekly Stochastic bar has %K above %D but still below k_ceiling -- the
# window BEFORE a sweet-spot/signal-scan buy trigger, meant as an early
# "starting to turn, worth watching" flag rather than an entry signal.
# Pure snapshot check (no "rising" requirement, unlike [stoch_scanner]'s
# sweet-spot check) -- per explicit user decision (2026-08-27), matching
# the strategy exactly as described: K>D and K<32, nothing more yet.
# k_ceiling is kept independent of [stoch_scanner]'s stoch_k_min (same
# value today, distinct concept -- same reasoning as [stoch_fresh_scan]'s
# entry_level). Stochastic length/smoothing reused from [stoch_scanner].
k_ceiling           = 32.0

[backtest_basic_trail]
# backtest_basic_trail.py: reuses backtest_signal.py's exact entry crossover
# (%K crosses strictly above entry_level, %K>%D) but replaces its exit
# entirely with a trail_pct% trailing stop off the highest weekly CLOSE
# since entry -- the ONLY exit (no signal exit, no take-profit, no time
# limit). Checked at each weekly close, not daily intraweek (a position can
# therefore gap below the stop and fill worse than exactly -trail_pct%).
# entry_level kept independent of [stoch_scanner]'s stoch_k_min (same
# convention as every other backtest_*/scan section here). No dollar
# notional -- pure % returns, per explicit user decision (2026-08-27):
# platform for testing settings, not simulating account size.
entry_level         = 32.0
trail_pct           = 20.0

[backtest_signal_sltp_sweep]
# backtest_signal_sltp_sweep.py: adds an SL/TP overlay + optional weekly
# EMA50>EMA200 long-term trend filter on top of backtest_signal.py's exact
# crossover rule. A regime-level check (~1yr vs ~4yr on weekly bars), not a
# short-term crossover -- targets setups where the stochastic bounce fires
# inside a still-declining multi-month/year trend (see 2026-07-26 analysis:
# EQT/NOG's losers). Replaces the earlier EMA10>EMA20 filter (2026-07-26),
# which was inconclusive on small sample sizes. SL/TP grids themselves are
# swept (module-level constants in the script, same convention as
# backtest_signal_sweep.py's stoch-param grids) -- only the fixed EMA filter
# periods live here.
ema_long_fast       = 50
ema_long_slow       = 200
