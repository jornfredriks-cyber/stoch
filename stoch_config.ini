[screener]
# Pre-filter thresholds applied before the stochastic scan (same intent as
# Darvas Phase3 Scan's screener: cut the ~6,500-ticker universe down to a
# liquid, trending, small set worth downloading OHLC for individually).
min_price           = 5.0
min_market_cap      = 500000000
min_avg_vol_30d     = 500000
min_adr_pct         = 2.0
ema_fast            = 50
ema_slow            = 200
rsi_low             = 45
rsi_high            = 75
ath_max_dist_pct    = 5.0
history_period      = 1y
fetch_chunk_size    = 50
inter_chunk_delay   = 1.0

[stoch_scanner]
# Weekly Stochastic Oscillator settings, per "Weekly Stochastic Sweet Spot
# Strategy.md": Length 19, %K smoothing 4, %D smoothing 4. Sweet spot band
# is 32-80 (%K inside the band, above %D, and rising vs. k_rising_lookback
# weeks back approximates catching the up-cross into/through the zone).
stoch_length        = 19
stoch_k_smooth      = 4
stoch_d_smooth      = 4
stoch_k_min         = 32.0
stoch_k_max         = 80.0
k_rising_lookback   = 1
fetch_chunk_size    = 50
